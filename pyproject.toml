[build-system]
requires = ["hatchling>=1.26", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "af-credmon"
authors = [
  { name = "Giordon Stark", email = "kratsg@gmail.com" },
]
description = "HTCondor credmon that exchanges AF MCP broker top tokens for per-user x509/krb5/ServiceX credentials on worker nodes"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Intended Audience :: System Administrators",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering",
  "Typing :: Typed",
]
dynamic = ["version"]
dependencies = [
  "af-credentials>=0.3.2",
  "httpx2>=2.5.0,<3",
  "htcondor>=24",
]

[project.scripts]
af-credmon = "af_credmon.daemon:main"

[project.urls]
Homepage = "https://github.com/maniaclab/af-credmon"
"Bug Tracker" = "https://github.com/maniaclab/af-credmon/issues"
Changelog = "https://github.com/maniaclab/af-credmon/releases"

[dependency-groups]
test = [
  "pytest >=8",
  "pytest-cov >=5",
  "pytest-asyncio >=0.24",
]
dev = [
  { include-group = "test" },
]
docs = [
    "zensical>=0.0.20",
]

[tool.hatch]
version.source = "vcs"
build.hooks.vcs.version-file = "src/af_credmon/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/af_credmon"]

[tool.pytest]
minversion = "8.0"
addopts = ["-ra", "--showlocals", "--strict-markers", "--strict-config"]
strict = true
filterwarnings = [
  "error",
]
log_level = "INFO"
testpaths = [
  "tests",
]
asyncio_mode = "auto"

[tool.coverage]
run.source = ["af_credmon"]
report.exclude_also = [
  '\.\.\.',
  'if typing.TYPE_CHECKING:',
]

[tool.mypy]
files = ["src", "tests"]
python_version = "3.11"
warn_unused_configs = true
strict = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]
warn_unreachable = true
disallow_untyped_defs = false
disallow_incomplete_defs = false

[[tool.mypy.overrides]]
module = "af_credmon.*"
disallow_untyped_defs = true
disallow_incomplete_defs = true

# The HTCondor Python bindings ship no type information.
[[tool.mypy.overrides]]
module = ["htcondor2"]
ignore_missing_imports = true

[tool.ruff]
show-fixes = true

[tool.ruff.lint]
extend-select = [
  "ARG", "B", "BLE", "C4", "DTZ", "EM", "EXE", "FA", "FLY", "FURB", "G",
  "I", "ICN", "ISC", "LOG", "PERF", "PGH", "PIE", "PL", "PT", "PTH", "PYI",
  "Q", "RET", "RSE", "RUF", "SIM", "T20", "TC", "TID", "TRY", "UP", "YTT",
]
ignore = [
  "PLR09",    # Too many <...>
  "PLR2004",  # Magic value used in comparison
  "ISC001",   # Conflicts with formatter
  "TRY003",   # Long messages outside exception class
  "EM101",    # String literal in exception
  "EM102",    # f-string in exception
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["T20", "PLC0415"]

[tool.codespell]
ignore-words-list = "ccache"

[tool.pylint]
py-version = "3.11"
ignore-paths = [".*/_version.py"]
reports.output-format = "colorized"
similarities.ignore-imports = "yes"
messages_control.disable = [
  "broad-exception-caught",
  "design",
  "duplicate-code",
  "fixme",
  "line-too-long",
  "missing-module-docstring",
  "missing-function-docstring",
  "wrong-import-order",
  "ungrouped-imports",
  "wrong-import-position",
]
