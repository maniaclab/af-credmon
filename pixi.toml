[workspace]
authors = ["Giordon Stark <kratsg@gmail.com>"]
name = "af-credmon"
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64", "osx-arm64"]
preview = ["pixi-build"]

[dependencies]
af-credmon = { path = "./" }

[package]
name = "af-credmon"
version = "latest"

[package.build]
backend = { name = "pixi-build-python", version = "*" }
config = { noarch = true }

[package.host-dependencies]
uv = "*"
hatchling = ">=1.25"
hatch-vcs = ">=0.4"

[package.run-dependencies]
af-credentials = ">=0.3.2"
httpx2 = ">=2.5.0,<3"
python-htcondor = ">=24"

[feature.test.dependencies]
pytest = ">=8"
pytest-cov = ">=5"
pytest-asyncio = ">=0.24"

[feature.test.tasks]
test = { cmd = "pytest", description = "Run tests" }
test-cov = { cmd = "pytest --cov=af_credmon --cov-report=term", description = "Run tests with coverage" }

[feature.dev.dependencies]
prek = "*"
mypy = "*"
ruff = "*"
tbump = ">=6.7.0"
pytest = ">=8"
pytest-asyncio = ">=0.24"

[feature.dev.tasks]
pre-commit = { cmd = "prek run --all-files", description = "Run pre-commit hooks on all files" }
typecheck = { cmd = "mypy", description = "Type-check src and tests" }

[environments]
test = ["test"]
dev = ["dev", "test"]

[tasks]
lint = { depends-on = ["pre-commit"], description = "Run all linting" }
check = { depends-on = ["lint", "test"], description = "Lint + tests" }
